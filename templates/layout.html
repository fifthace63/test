<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>برنامه مدیریت دارو</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <nav class="container nav">
        <a href="{{ url_for('daily_view') }}" class="brand">مدیریت دارو</a>
        <div class="nav-links">
          <a href="{{ url_for('daily_view') }}">برنامه امروز</a>
          <a href="{{ url_for('meds_list') }}">داروها</a>
        </div>
      </nav>
    </header>

    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flash-list">
            {% for category, message in messages %}
              <li class="flash {{ category }}">{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>

    <footer class="container footer">
      <small>ساخته شده برای مدیریت آسان مصرف داروها</small>
    </footer>
  </body>
</html>
